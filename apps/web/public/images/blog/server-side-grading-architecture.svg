<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid pattern overlay -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Title & Subtitle Badge -->
  <rect x="80" y="50" width="220" height="32" rx="16" fill="rgba(20,184,166,0.12)" stroke="#14B8A6" stroke-width="1" />
  <text x="190" y="71" fill="#14B8A6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">EXAM ARCHITECTURE 01</text>
  <text x="80" y="115" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800">Server-Side Edge Grading vs. Client Vulnerability</text>
  <text x="80" y="142" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14">Eliminating Inspect Element Exploits via V8 Worker Isolates</text>

  <!-- Left: The Insecure Client Model -->
  <rect x="80" y="180" width="320" height="390" rx="20" fill="#0D111A" stroke="rgba(244,63,94,0.3)" stroke-width="1.5" />
  <rect x="100" y="200" width="130" height="26" rx="13" fill="rgba(244,63,94,0.15)" />
  <text x="165" y="217" fill="#F43F5E" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">RAW GOOGLE FORMS</text>
  <text x="100" y="255" fill="#F87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold">Client-Side Leakage</text>
  
  <rect x="100" y="275" width="280" height="90" rx="12" fill="#161B26" stroke="rgba(244,63,94,0.2)" stroke-width="1" />
  <text x="115" y="300" fill="#EF4444" font-family="monospace" font-size="11">&lt;input type="hidden"&gt;</text>
  <text x="115" y="322" fill="#FCA5A5" font-family="monospace" font-size="11">data-answer="correct_opt_C"</text>
  <text x="115" y="344" fill="#64748B" font-family="monospace" font-size="10">// Visible in DevTools Network/DOM</text>

  <text x="100" y="395" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Answer keys sent directly to browser</text>
  <text x="100" y="425" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Client JS controls timer (easily frozen)</text>
  <text x="100" y="455" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12">• Personal @gmail bypasses attendance</text>
  
  <rect x="100" y="500" width="280" height="46" rx="10" fill="rgba(244,63,94,0.1)" stroke="rgba(244,63,94,0.3)" />
  <text x="240" y="528" fill="#F87171" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">❌ COMPROMISED INTEGRITY</text>

  <!-- Middle: Cloudflare Worker Edge Arbiter -->
  <rect x="440" y="210" width="320" height="330" rx="20" fill="url(#tealGrad)" opacity="0.15" />
  <rect x="440" y="210" width="320" height="330" rx="20" fill="none" stroke="#14B8A6" stroke-width="2" filter="url(#glow)" />
  <rect x="460" y="235" width="160" height="26" rx="13" fill="#14B8A6" />
  <text x="540" y="252" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CLOUDFLARE WORKER</text>
  <text x="460" y="295" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Isolated Edge Arbiter</text>

  <rect x="460" y="315" width="280" height="110" rx="12" fill="#07090E" stroke="rgba(20,184,166,0.4)" stroke-width="1" />
  <text x="475" y="340" fill="#2DD4BF" font-family="monospace" font-size="11">evalAnswers(studentSub, keyVault)</text>
  <text x="475" y="362" fill="#94A3B8" font-family="monospace" font-size="10">Execution: &lt;150ms in V8 Isolate</text>
  <text x="475" y="384" fill="#94A3B8" font-family="monospace" font-size="10">SVG Signature Seal: In-Memory</text>
  <text x="475" y="406" fill="#14B8A6" font-family="monospace" font-size="10">Result: Atomic Ledger Dispatch</text>

  <text x="460" y="455" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">✓ Zero keys ever leave the edge server</text>
  <text x="460" y="480" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">✓ RLS Policy: Authenticated Service Role Only</text>

  <rect x="460" y="505" width="280" height="20" rx="4" fill="#14B8A6" opacity="0.3" />
  <text x="600" y="519" fill="#2DD4BF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LATENCY: 120ms - 150ms</text>

  <!-- Right: Secure Isolated Data Planes -->
  <rect x="800" y="180" width="320" height="180" rx="16" fill="#0D111A" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="825" y="215" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">01. ISOLATED ANSWER KEYS</text>
  <text x="825" y="240" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">public.test_answer_keys</text>
  <text x="825" y="265" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Protected by Postgres RLS DENY ALL</text>
  <text x="825" y="285" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Accessible only via SUPABASE_SECRET_KEY</text>
  <rect x="825" y="310" width="160" height="24" rx="6" fill="rgba(56,189,248,0.1)" stroke="#38BDF8" />
  <text x="905" y="326" fill="#38BDF8" font-family="monospace" font-size="10" text-anchor="middle">ENCRYPTED AT REST</text>

  <rect x="800" y="390" width="320" height="180" rx="16" fill="#0D111A" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="825" y="425" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold">02. AUDIT GRADE LEDGER</text>
  <text x="825" y="450" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">public.student_results</text>
  <text x="825" y="475" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Immutable attempt records (~200B/row)</text>
  <text x="825" y="495" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Instant SVG review with teacher blessings</text>
  <rect x="825" y="520" width="160" height="24" rx="6" fill="rgba(52,211,153,0.1)" stroke="#34D399" />
  <text x="905" y="536" fill="#34D399" font-family="monospace" font-size="10" text-anchor="middle">NBA/NAAC AUDIT PROOF</text>

  <!-- Connectors -->
  <path d="M 400 375 L 440 375" stroke="#F43F5E" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 760 300 L 800 270" stroke="#14B8A6" stroke-width="2" />
  <path d="M 760 450 L 800 480" stroke="#14B8A6" stroke-width="2" />
</svg>
